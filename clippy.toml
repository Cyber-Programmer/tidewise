# Clippy configuration for the whole workspace (WBS 5.4; golden rules 3 and 7; threats T-04, T-17, T-20).
#
# Starting a program and deleting a file are the two things in this project that must happen in a few known places
# only. Clippy refuses them everywhere else, so a new call fails `cargo clippy -- -D warnings` (and CI) until a person
# reads it and allows it, with a reason, in one function. Where they are allowed today:
#   Command::new    crates/pacman/src/run.rs (the read-only pacman runner), crates/helper/src/runner.rs (the helper's
#                   pacman runner), and tests (their own helper functions and crates/helper/tests/not_root.rs).
#   remove_*        crates/helper/src/removal.rs (the helper's one deletion point); crates/pacman/src/private_lists.rs
#                   `remove_stale_lock` only (6.11, decision 0008): the left-over db.lck of the app's own private list
#                   folder, never any other path; and the TempDir of each crate's tests.
#   rename          crates/helper/src/lists.rs `replace_list` only (6.10b, decision 0007): one rename of a staged pacman list
#                   over the real one, inside the real /var/lib/pacman/sync folder (cache-class data, not a user file).
#   rustix unlink*, rmdir, rename*   nowhere today: nothing calls them.
#   tests/container is a crate that runs programs and removes files inside a throwaway container by design; it has one
#   crate-wide allow in its Cargo.toml.
# User files are never deleted by the app at all (golden rule 7: they go to the Trash).
disallowed-methods = [
    { path = "std::process::Command::new", reason = "programs are started only by the pacman runners (golden rule 3: absolute path, argument list, no shell); allow it in one function with a reason" },
    { path = "std::fs::remove_file", reason = "files are deleted only through crates/helper/src/removal.rs (golden rule 7); allow it in one function with a reason" },
    { path = "std::fs::remove_dir", reason = "folders are never deleted by the product; tests use their crate's TempDir (golden rule 7)" },
    { path = "std::fs::remove_dir_all", reason = "folders are never deleted by the product; tests use their crate's TempDir (golden rule 7)" },
    { path = "std::fs::rename", reason = "a rename deletes the file it replaces (golden rule 7); allow it in one function with a reason" },
    # rustix is a dependency of the helper only (for `umask`; its `fs` feature is what gates that call). Its deleting
    # calls are banned like the std ones, and so is renaming, which deletes the file it replaces. The other crates do
    # not depend on rustix, so these paths do not resolve there: measured with clippy 0.1.99 (stable on 16 Nov 2026,
    # what CI uses) that does not warn. If a later clippy does, add `allow-invalid = true` to these six entries.
    { path = "rustix::fs::unlink", reason = "files are deleted only through crates/helper/src/removal.rs (golden rule 7)" },
    { path = "rustix::fs::unlinkat", reason = "files are deleted only through crates/helper/src/removal.rs (golden rule 7)" },
    { path = "rustix::fs::rmdir", reason = "folders are never deleted by the product (golden rule 7)" },
    { path = "rustix::fs::rename", reason = "a rename deletes the file it replaces (golden rule 7); allow it in one function with a reason" },
    { path = "rustix::fs::renameat", reason = "a rename deletes the file it replaces (golden rule 7); allow it in one function with a reason" },
    { path = "rustix::fs::renameat_with", reason = "a rename deletes the file it replaces (golden rule 7); allow it in one function with a reason" },
]
