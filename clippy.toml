# Clippy configuration for the whole workspace (WBS 5.4; golden rules 3 and 7; threats T-04, T-17, T-20).
#
# Starting a program and deleting a file are the two things in this project that must happen in a few known places
# only. Clippy refuses them everywhere else, so a new call fails `cargo clippy -- -D warnings` (and CI) until a person
# reads it and allows it, with a reason, in one function. Where they are allowed today:
#   Command::new    crates/pacman/src/run.rs (the read-only pacman runner), crates/helper/src/runner.rs (the helper's
#                   pacman runner), and tests (their own helper functions and crates/helper/tests/not_root.rs).
#   remove_*        crates/helper/src/removal.rs (the helper's one deletion point), and the TempDir of each crate's tests.
#   tests/container is a crate that runs programs and removes files inside a throwaway container by design; it has one
#   crate-wide allow in its Cargo.toml.
# User files are never deleted by the app at all (golden rule 7: they go to the Trash).
disallowed-methods = [
    { path = "std::process::Command::new", reason = "programs are started only by the pacman runners (golden rule 3: absolute path, argument list, no shell); allow it in one function with a reason" },
    { path = "std::fs::remove_file", reason = "files are deleted only through crates/helper/src/removal.rs (golden rule 7); allow it in one function with a reason" },
    { path = "std::fs::remove_dir", reason = "folders are never deleted by the product; tests use their crate's TempDir (golden rule 7)" },
    { path = "std::fs::remove_dir_all", reason = "folders are never deleted by the product; tests use their crate's TempDir (golden rule 7)" },
]
