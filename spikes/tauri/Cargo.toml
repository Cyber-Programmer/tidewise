[package]
name = "tidewise-spike-tauri"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
tauri = "2"
tidewise-core = { path = "../../crates/core" }

[build-dependencies]
tauri-build = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true

[features]
# Same switch `cargo tauri build` turns on: serve the bundled ui/ instead of a dev server.
custom-protocol = ["tauri/custom-protocol"]
