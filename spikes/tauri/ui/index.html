<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidewise spike (Tauri)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <nav aria-label="Main" class="sidebar">
    <div class="brand">Tidewise</div>
    <a class="nav" href="#">Home</a>
    <a class="nav" href="#">Clean up</a>
    <a class="nav" href="#">Apps</a>
    <a class="nav" href="#">Storage</a>
    <a class="nav active" href="#" aria-current="page">Performance</a>
    <a class="nav" href="#">Processes</a>
    <a class="nav" href="#">Startup apps</a>
    <a class="nav" href="#">Services</a>
    <div class="grow"></div>
    <a class="nav" href="#">History</a>
    <a class="nav" href="#">Settings</a>
  </nav>

  <main>
    <h1>Performance</h1>
    <p class="sub">Live · last 60 seconds</p>
    <div class="columns">
      <div role="tablist" aria-label="Resource" id="cards" class="cards"></div>

      <section role="tabpanel" id="panel" class="panel">
        <div class="panel-head">
          <div>
            <div class="label" id="p-label"></div>
            <h2 id="p-headline"></h2>
          </div>
          <div class="big"><span id="p-value" class="mono"></span><span id="p-unit" class="unit"></span></div>
        </div>
        <div class="chart">
          <svg id="chart" viewBox="0 0 600 200" preserveAspectRatio="none" role="img" aria-label="Last 60 seconds">
            <line x1="0" y1="5" x2="600" y2="5" class="grid"></line>
            <line x1="0" y1="100" x2="600" y2="100" class="grid"></line>
            <line x1="0" y1="195" x2="600" y2="195" class="grid"></line>
            <polygon id="area" points="" fill-opacity="0.12"></polygon>
            <polyline id="line" points="" fill="none" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"></polyline>
          </svg>
          <div class="axis"><span>60 seconds ago</span><span>top of chart: <span id="p-axis"></span></span><span>now</span></div>
        </div>
        <h3 id="proc-title">All processes</h3>
        <div class="procs" id="procs" tabindex="0" aria-label="Processes"></div>
      </section>
    </div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
