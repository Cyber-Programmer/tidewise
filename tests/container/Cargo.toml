[package]
name = "tidewise-container-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Tests that run real pacman as root. They only run inside the Tidewise test container."

# Not product code: these tests start programs (pacman, kill, flock, repo-add) and remove files and folders inside a
# throwaway container, by design. The ban in the workspace's clippy.toml (golden rules 3 and 7) is for the product,
# so the lint is off for this one crate. Nothing else in the workspace has a crate-wide allow.
[lints.clippy]
disallowed_methods = "allow"

# Workspace path crates only, never crates.io. The install resolver tests (resolver.rs) run `tidewise-pacman` itself
# against the real pacman in the container, so this crate depends on it (and, through it, on `tidewise-names`).
# That adds no external code: the test binary is built on the host with the rest of the workspace and mounted into
# the container read-only, so nothing is built or fetched inside the throwaway image. Keep it that way: a dependency
# from crates.io here would need the human's approval like any other (CLAUDE.md).
[dependencies]
tidewise-pacman = { version = "0.1.0", path = "../../crates/pacman" }
