<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tidewise — Search</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0D0F13}
a{color:#5DDCB0}a:hover{color:#8BEACB}
.res:hover{background:#1E242D}
:focus-visible{outline:2px solid #5DDCB0;outline-offset:2px}
input::placeholder{color:#808897}
</style>
</helmet>
<div style="position: relative; min-height: 960px; background: #0D0F13; color: #ECEEF2; font-family: 'Geist', system-ui, sans-serif; overflow: hidden;">

<div aria-hidden="true" style="display: flex; flex-wrap: wrap; min-height: 960px; opacity: 0.35;">
<div style="flex: 1 1 220px; background: #111419; border-right: 1px solid #1F242D; padding: 26px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px;">
<div style="width: 120px; height: 22px; border-radius: 6px; background: #2A303B;"></div>
<div style="width: 140px; height: 14px; border-radius: 6px; background: #232933; margin-top: 18px;"></div>
<div style="width: 110px; height: 14px; border-radius: 6px; background: #232933;"></div>
<div style="width: 130px; height: 14px; border-radius: 6px; background: #232933;"></div>
<div style="width: 100px; height: 14px; border-radius: 6px; background: #232933;"></div>
<div style="width: 120px; height: 14px; border-radius: 6px; background: #232933;"></div>
</div>
<div style="flex: 999 1 560px; min-width: 0; padding: 32px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px;">
<div style="width: 160px; height: 26px; border-radius: 6px; background: #2A303B;"></div>
<div style="height: 180px; border-radius: 18px; background: #161A21; border: 1px solid #232933;"></div>
<div style="height: 70px; border-radius: 14px; background: #161A21; border: 1px solid #232933;"></div>
<div style="height: 70px; border-radius: 14px; background: #161A21; border: 1px solid #232933;"></div>
<div style="height: 70px; border-radius: 14px; background: #161A21; border: 1px solid #232933;"></div>
</div>
</div>

<div style="position: absolute; inset: 0; background: rgba(6, 7, 10, 0.62); display: flex; justify-content: center; align-items: flex-start; padding: 96px 16px 32px; box-sizing: border-box;">
<div role="dialog" aria-modal="true" aria-label="Search" style="width: 100%; max-width: 680px; border-radius: 18px; background: #161A21; border: 1px solid #2E3541; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5); overflow: hidden;">
<div style="display: flex; align-items: center; gap: 12px; padding: 0 18px; height: 60px; border-bottom: 1px solid #232933;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A9B0BC" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input type="search" aria-label="Search apps, files, settings and actions" placeholder="Search apps, files, settings and actions" value="{{q}}" onChange="{{onQ}}" style="flex-grow: 1; height: 100%; background: transparent; border: 0; outline: none; color: #ECEEF2; font: inherit; font-size: 17px;">
<a href="Main.dc.html" style="font-family: 'Geist Mono', monospace; font-size: 11px; padding: 3px 7px; border-radius: 5px; border: 1px solid #2A303B; color: #A9B0BC; text-decoration: none;">Esc</a>
</div>
<div style="max-height: 560px; overflow-y: auto; padding: 8px;">
<sc-for list="{{sections}}" as="s" hint-placeholder-count="3">
<div style="padding: 10px 10px 6px; font-size: 12px; font-weight: 600; color: #808897; text-transform: uppercase; letter-spacing: 0.05em;">{{s.label}}</div>
<sc-for list="{{s.items}}" as="r" hint-placeholder-count="2">
<a class="res" href="{{r.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 10px; border-radius: 10px; background: {{r.bg}}; color: #ECEEF2; text-decoration: none;">
<span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 9px; background: {{r.iconBg}}; color: {{r.iconFg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"></path></svg></span>
<span style="flex: 1 1 auto; min-width: 0;"><span style="display: block; font-size: 14px; font-weight: 600;">{{r.name}}</span><span style="display: block; font-size: 12px; color: #A9B0BC; margin-top: 1px;">{{r.meta}}</span></span>
<span style="font-size: 12px; color: {{r.hintFg}}; white-space: nowrap;">{{r.hint}}</span>
</a>
</sc-for>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="padding: 36px 16px; text-align: center;">
<div style="font-size: 15px; font-weight: 600;">Nothing matches "{{q}}"</div>
<div style="font-size: 13px; color: #A9B0BC; margin-top: 6px; line-height: 1.5;">Try an app name, a file name, or what you want to do, like "free space" or "startup".</div>
</div>
</sc-if>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px; padding: 10px 18px; border-top: 1px solid #232933; font-size: 12px; color: #808897;">
<span><span style="font-family: 'Geist Mono', monospace; color: #A9B0BC;">↑ ↓</span> move</span>
<span><span style="font-family: 'Geist Mono', monospace; color: #A9B0BC;">Enter</span> open</span>
<span><span style="font-family: 'Geist Mono', monospace; color: #A9B0BC;">Esc</span> close</span>
<span style="margin-left: auto;">Files: searches your home folder by name only</span>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":960}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: 'fire' };
  }
  renderVals() {
    var self = this;
    var ic = {
      Apps: { p: 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z', fg: '#7AA7FF', bg: '#1B2A45' },
      Processes: { p: 'M8 6h13M8 12h13M8 18h13', fg: '#C9CED6', bg: '#232933' },
      Files: { p: 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z', fg: '#F2B84B', bg: '#3A2E14' },
      Actions: { p: 'M13 3L4 14h7l-1 7 9-11h-7z', fg: '#5DDCB0', bg: '#173A2F' },
      Settings: { p: 'M4 7h10M18 7h2M4 17h4M12 17h8', fg: '#C3A2FF', bg: '#2C2342' }
    };
    var all = [
      { g: 'Apps', name: 'Firefox', meta: 'System app · 248 MB', href: 'Apps.dc.html', k: 'browser web' },
      { g: 'Apps', name: 'Steam', meta: 'Flatpak · 1.4 GB', href: 'Apps.dc.html', k: 'games' },
      { g: 'Apps', name: 'LibreOffice', meta: 'System app · 580 MB', href: 'Apps.dc.html', k: 'office documents' },
      { g: 'Apps', name: 'Spotify', meta: 'Snap · 290 MB', href: 'Apps.dc.html', k: 'music' },
      { g: 'Processes', name: 'Firefox', meta: 'Running · 14 processes · 2.1 GB memory', href: 'Processes.dc.html', k: 'browser memory' },
      { g: 'Processes', name: 'Steam', meta: 'Running · downloading at 1.9 MB/s', href: 'Processes.dc.html', k: 'games network' },
      { g: 'Files', name: 'firefox-profile-backup.tar.gz', meta: 'Documents · 1.1 GB · opened 5 months ago', href: 'Storage.dc.html', k: '' },
      { g: 'Files', name: 'ubuntu-24.04-desktop-amd64.iso', meta: 'Downloads · 6.1 GB', href: 'Storage.dc.html', k: 'iso installer' },
      { g: 'Actions', name: 'Clean up junk files', meta: '12.6 GB found', href: 'Cleaner.dc.html', k: 'free space junk cache clean' },
      { g: 'Actions', name: "See what's using space", meta: 'Storage', href: 'Storage.dc.html', k: 'free space disk full big files' },
      { g: 'Actions', name: 'Stop apps opening at login', meta: 'Startup apps', href: 'Startup.dc.html', k: 'startup boot slow login' },
      { g: 'Actions', name: 'See what is slowing my PC', meta: 'Performance', href: 'Performance.dc.html', k: 'slow memory cpu hot laggy' },
      { g: 'Settings', name: 'Theme', meta: 'Appearance', href: 'Settings.dc.html', k: 'dark light' },
      { g: 'Settings', name: 'Check for updates', meta: 'Privacy & updates', href: 'Settings.dc.html', k: 'version update' },
      { g: 'Settings', name: 'Admin access', meta: 'Password and helper', href: 'Settings.dc.html', k: 'root sudo password' }
    ];
    var q = (this.state.q || '').toLowerCase().trim();
    var hits = all.filter(function (r) { return !q || (r.name + ' ' + r.k + ' ' + r.meta).toLowerCase().indexOf(q) >= 0; });
    var first = true;
    var sections = ['Apps', 'Processes', 'Files', 'Actions', 'Settings'].map(function (g) {
      var items = hits.filter(function (r) { return r.g === g; }).map(function (r) {
        var top = first; first = false;
        return Object.assign({}, r, {
          icon: ic[g].p, iconFg: ic[g].fg, iconBg: ic[g].bg,
          bg: top ? '#1E242D' : 'transparent',
          hint: top ? 'Enter' : (g === 'Processes' ? 'End or view' : 'Open'),
          hintFg: top ? '#5DDCB0' : '#808897'
        });
      });
      return { label: g, items: items };
    }).filter(function (s) { return s.items.length > 0; });
    return {
      q: this.state.q,
      onQ: function (e) { self.setState({ q: e.target.value }); },
      sections: sections,
      empty: sections.length === 0
    };
  }
}
</script>
</body>
</html>
