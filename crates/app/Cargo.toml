[package]
name = "tidewise-app"
description = "Tidewise UI and view models."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tidewise"
path = "src/main.rs"

[dependencies]
slint = "1.18.1"
image = { version = "0.25", default-features = false, features = ["png"] }
